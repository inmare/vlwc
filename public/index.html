<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/x-icon" />
    <!-- css -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.min.css"
    />
    <!-- fonts -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Mono:wght@400;700&display=swap"
    />
    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <style>
      body,
      button,
      input,
      textarea,
      select {
        font-family: 'Noto Sans KR', sans-serif;
      }

      code,
      pre,
      kbd,
      samp {
        font-family: 'Noto Sans Mono', monospace;
      }

      #song-json {
        max-height: 32rem;
        overflow: auto;
      }
    </style>
    <title>vlwm alpha</title>
  </head>
  <body>
    <div>
      <h1><i class="bi bi-music-note-list" aria-hidden="true"></i> vlwm</h1>
      <p>곡 목록</p>
      <form id="search-form" role="search">
        <input
          id="query"
          name="q"
          type="search"
          placeholder="곡 제목 또는 원제 검색"
          aria-label="검색어"
          maxlength="100"
        />
        <button type="submit">
          <i class="bi bi-search" aria-hidden="true"></i> 검색
        </button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="list"></ul>
      <nav aria-label="곡 목록 페이지">
        <button id="prev" disabled>
          <i class="bi bi-chevron-left" aria-hidden="true"></i> 이전
        </button>
        <span id="page-number">1페이지</span>
        <button id="next" disabled>
          다음 <i class="bi bi-chevron-right" aria-hidden="true"></i>
        </button>
      </nav>
      <section id="song-detail" aria-labelledby="song-detail-title" hidden>
        <h2 id="song-detail-title">곡 상세 JSON</h2>
        <p id="song-detail-status" role="status" aria-live="polite"></p>
        <pre><code id="song-json"></code></pre>
      </section>
    </div>
    <script>
      const form = document.querySelector('#search-form');
      const input = document.querySelector('#query');
      const list = document.querySelector('#list');
      const status = document.querySelector('#status');
      const pageNumber = document.querySelector('#page-number');
      const prevButton = document.querySelector('#prev');
      const nextButton = document.querySelector('#next');
      const songDetail = document.querySelector('#song-detail');
      const songDetailStatus = document.querySelector('#song-detail-status');
      const songJson = document.querySelector('#song-json');
      let detailController;
      let cursors = [0];
      let page = 0;
      let nextCursor = null;
      let query = '';
      let loading = false;

      async function loadSong(song) {
        detailController?.abort();
        const controller = new AbortController();
        detailController = controller;
        songDetail.hidden = false;
        songDetail.setAttribute('aria-busy', 'true');
        songDetailStatus.textContent = `${song.title} · 불러오는 중…`;
        songJson.textContent = '';
        try {
          const params = new URLSearchParams({ id: String(song.id) });
          const response = await fetch(`/api/song?${params}`, {
            signal: controller.signal,
          });
          if (!response.ok) throw new Error(`조회 실패 (${response.status})`);
          const result = await response.json();
          if (controller.signal.aborted) return;
          if (!result) throw new Error('곡을 찾을 수 없습니다.');
          songJson.textContent = JSON.stringify(result, null, 2);
          songDetailStatus.textContent = song.title;
        } catch (error) {
          if (controller.signal.aborted) return;
          songDetailStatus.textContent = `${error.message} · 곡을 클릭해 다시 시도해 주세요.`;
        } finally {
          if (detailController === controller) {
            songDetail.setAttribute('aria-busy', 'false');
          }
        }
      }

      async function loadPage(targetPage, targetCursors, targetQuery) {
        if (loading) return;
        loading = true;
        prevButton.disabled = true;
        nextButton.disabled = true;
        form.querySelector('button').disabled = true;
        list.setAttribute('aria-busy', 'true');
        status.textContent = '불러오는 중…';
        try {
          const params = new URLSearchParams({
            afterId: String(targetCursors[targetPage]),
            limit: '10',
          });
          const endpoint = targetQuery ? '/api/search' : '/api/songlists';
          if (targetQuery) params.set('q', targetQuery);
          const response = await fetch(`${endpoint}?${params}`);
          if (!response.ok) throw new Error(`조회 실패 (${response.status})`);
          const json = await response.json();
          const rows = json.items.map((song) => {
            const li = document.createElement('li');
            const title = document.createElement('a');
            title.href = `/api/song?id=${song.id}`;
            title.textContent = song.title;
            title.addEventListener('click', (event) => {
              if (
                event.ctrlKey ||
                event.metaKey ||
                event.shiftKey ||
                event.altKey
              )
                return;

              event.preventDefault();
              loadSong(song);
            });
            li.append(title);
            if (song.originalTitle && song.originalTitle !== song.title) {
              const original = document.createElement('small');
              original.textContent = song.originalTitle;
              li.append(document.createElement('br'), original);
            }
            return li;
          });
          list.replaceChildren(...rows);
          page = targetPage;
          cursors = targetCursors;
          query = targetQuery;
          nextCursor = json.nextCursor;
          pageNumber.textContent = `${page + 1}페이지`;
          status.textContent = json.items.length
            ? `${json.items.length}곡 표시${nextCursor === null ? ' · 마지막 페이지' : ''}`
            : targetQuery
              ? '검색 결과가 없습니다.'
              : '등록된 곡이 없습니다.';
        } catch (error) {
          status.textContent = `${error.message} · 검색 버튼으로 다시 시도해 주세요.`;
        } finally {
          loading = false;
          prevButton.disabled = page === 0;
          nextButton.disabled = nextCursor === null;
          form.querySelector('button').disabled = false;
          list.setAttribute('aria-busy', 'false');
        }
      }

      prevButton.addEventListener('click', () =>
        loadPage(page - 1, cursors, query),
      );
      nextButton.addEventListener('click', () => {
        if (nextCursor === null) return;
        loadPage(page + 1, [...cursors.slice(0, page + 1), nextCursor], query);
      });
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        loadPage(0, [0], input.value.trim());
      });
      loadPage(0, [0], '');
    </script>
  </body>
</html>
